<!DOCTYPE html>
<html lang="ar" dir="rtl"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>حجوزاتي | أوسكار ألمع</title><style>
*{box-sizing:border-box}body{margin:0;background:#f7f1e7;color:#29251f;font-family:Tahoma,Arial,sans-serif}.top{padding:18px;background:#10100f;color:#e4c35f}.top div{width:min(1100px,calc(100% - 28px));margin:auto;display:flex;align-items:center;justify-content:space-between;gap:20px}.top a{color:#e4c35f;text-decoration:none;font-weight:bold}.wrap{width:min(1100px,calc(100% - 28px));margin:auto;padding:55px 0}.wrap h1{font-size:clamp(30px,5vw,46px)}.list{display:grid;gap:18px}.card{padding:24px;border:1px solid #dfd3c0;border-radius:16px;background:#fff}.head{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap}.status{padding:7px 11px;border-radius:999px;background:#10100f;color:#e4c35f}.details{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:16px}.detail{padding:12px;border-radius:9px;background:#f7f1e7}.services{line-height:1.9}.empty{padding:40px;background:#fff;border-radius:16px;text-align:center}@media(max-width:700px){.details{grid-template-columns:1fr}}
</style></head><body><header class="top"><div><strong>أوسكار ألمع</strong><a href="index.html">العودة للرئيسية</a></div></header>
<main class="wrap"><h1>حجوزاتي</h1><p>الطلبات المحفوظة على هذا الجهاز.</p><div class="list" id="bookingsList"></div></main>
<script>
(function(){const target=document.getElementById('bookingsList');let items=[];try{items=JSON.parse(localStorage.getItem('oskarAlmaaBookings')||'[]')}catch(e){}if(!items.length){target.innerHTML='<div class="empty"><p>لا توجد حجوزات محفوظة على هذا الجهاز.</p><a href="index.html#services">ابدأ باختيار خدماتك</a></div>';return}items.forEach(function(b){const card=document.createElement('article');card.className='card';const date=new Date(b.date+'T12:00:00');const g=new Intl.DateTimeFormat('ar-SA-u-ca-gregory',{year:'numeric',month:'long',day:'numeric'}).format(date);const h=new Intl.DateTimeFormat('ar-SA-u-ca-islamic-umalqura',{year:'numeric',month:'long',day:'numeric'}).format(date);card.innerHTML='<div class="head"><h2>'+escapeHtml(b.reference)+' — '+escapeHtml(b.type)+'</h2><span class="status">'+escapeHtml(b.status)+'</span></div><div class="details"><div class="detail"><strong>التاريخ</strong><br>'+g+' | '+h+'</div><div class="detail"><strong>الموقع</strong><br>'+escapeHtml(b.region)+' — '+escapeHtml(b.city)+'</div><div class="detail"><strong>القاعة</strong><br>'+escapeHtml(b.venue)+'</div></div><ul class="services">'+b.services.map(function(s){return '<li>'+escapeHtml(s)+'</li>'}).join('')+'</ul>';target.appendChild(card)});function escapeHtml(value){const div=document.createElement('div');div.textContent=value||'';return div.innerHTML}})();
</script></body></html>
